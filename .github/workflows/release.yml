name: Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "0.0.8"
      target:
        description: "Build target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - macos
          - windows
      publish:
        description: "Publish a GitHub Release"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Publish and mark the GitHub Release as a pre-release"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows'
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ github.event.inputs.version || github.ref_name }}
    secrets: inherit

  macos:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'macos'
    uses: ./.github/workflows/release-macos.yml
    with:
      version: ${{ github.event.inputs.version || github.ref_name }}
    secrets: inherit

  github-release:
    name: Publish GitHub Release
    if: >-
      always() &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        (github.event_name == 'workflow_dispatch' && (inputs.publish == true || inputs.prerelease == true))
      ) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION_INPUT: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: "!*-stage"
      - name: Split oversized release assets
        shell: bash
        run: |
          set -euo pipefail
          max_size=$((2040 * 1024 * 1024))
          has_split=0

          shopt -s nullglob
          for file in artifacts/*; do
            [ -f "$file" ] || continue
            size=$(stat -c%s "$file")
            if [ "$size" -gt "$max_size" ]; then
              echo "Splitting $(basename "$file") (${size} bytes)"
              sha256sum "$file" > "$file.sha256"
              split -b "$max_size" -d -a 3 "$file" "$file.part-"
              rm "$file"
              has_split=1
            fi
          done

          if [ "$has_split" = "1" ]; then
            cat > artifacts/SPLIT-ASSETS-README.txt <<'EOF'
          Some release assets are split because GitHub Releases require each file to be under 2 GiB.

          Linux/macOS:
            cat Pymss-Studio-xxx.part-* > Pymss-Studio-xxx
            sha256sum -c Pymss-Studio-xxx.sha256

          Windows CMD:
            copy /b Pymss-Studio-xxx.part-000+Pymss-Studio-xxx.part-001 Pymss-Studio-xxx

          Download all parts for the same filename before merging.
          EOF
          fi
      - name: Resolve release tag
        shell: bash
        run: |
          version="${RELEASE_VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $RELEASE_VERSION_INPUT" >&2
            exit 1
          fi
          version="${version#v}"
          echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Pymss Studio v${version}" >> "$GITHUB_ENV"
          if [[ "$version" == *-* ]]; then
            echo "RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_PRERELEASE=${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}" >> "$GITHUB_ENV"
          fi
      - name: Generate updater metadata
        if: needs.windows.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          sig="artifacts/Pymss-Studio-${version}-windows-x64-online-updater.exe.sig"
          exe="artifacts/Pymss-Studio-${version}-windows-x64-online-updater.exe"
          if [ ! -f "$sig" ] || [ ! -f "$exe" ]; then
            echo "Online updater artifact or signature not found" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          tag = os.environ["RELEASE_TAG"]
          signature = Path(f"artifacts/Pymss-Studio-{version}-windows-x64-online-updater.exe.sig").read_text(encoding="utf-8").strip()
          data = {
              "version": version,
              "notes": "See the GitHub release notes for details.",
              "pub_date": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": signature,
                      "url": f"https://github.com/pymss-project/pymss-studio/releases/download/{tag}/Pymss-Studio-{version}-windows-x64-online-updater.exe",
                  }
              },
          }
          Path("artifacts/latest.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          generate_release_notes: true
          files: artifacts/*
